# Build script approval for dependencies.
# pnpm 11 removed onlyBuiltDependencies and replaced it with an allowBuilds
# map of package -> boolean. Kept in the same style as Core's config.
# See https://pnpm.io/settings#allowbuilds
allowBuilds:
  # Native engine behind Tailwind v4, required by @tailwindcss/vite.
  '@tailwindcss/oxide': true
  # dugite is Core's git engine. Its postinstall downloads the embedded git
  # executable, so the build must run or every git operation at runtime fails.
  dugite: true
  # electron publishes no install script of its own, and has not since the
  # binary moved to a first-run download in Electron 42. The entry stays so a
  # release that brings one back does not stop an install in CI.
  electron: true
  # Downloads the Squirrel.Windows binaries used when packaging for Windows.
  electron-winstaller: true
  # esbuild is no longer in the tree, since vite 8 bundles with rolldown. The
  # entry stays for the day it arrives again: its platform binary ships prebuilt
  # in @esbuild/<platform>, which the JS API resolves directly, so its
  # postinstall build is redundant. Same reasoning as in Core, which still has it.
  esbuild: false
# Agent skill approval, which pnpm 12 added alongside build script approval.
# A dependency may ship skills that an agent in this repository would load.
# Nothing here reads them, and an undecided package makes every install print
# "awaiting approval", so each one that asks is denied explicitly.
# See https://pnpm.io/settings#permissions
permissions:
  '@tanstack/react-router':
    skills: false
  '@tanstack/react-table':
    skills: false
  '@tanstack/router-plugin':
    skills: false
# Do not reuse pnpm's cache of postinstall (side effect) output. Since pnpm 8.7
# the content addressable store keeps such files as plain copies, not symlinks.
# dugite's postinstall lays down git, whose git-core is ~145 symlinks to one
# binary. Restoring that from a warm store (the CI pnpm cache) flattens them
# into 145 full copies, which doubled the packaged macOS app. With this off
# dugite re-extracts git each install, so the symlinks survive.
# Reported as pnpm/pnpm#12859 (see also #7691). Remove once that is fixed.
sideEffectsCache: false
